<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="mb-4 text-center">QUẢN LÝ SINH VIÊN</h2>

    <!-- Thanh Tìm Kiếm & Nút Thêm -->
    <div class="row mb-3">
        <div class="col-md-8">
            <div class="input-group">
                <input type="text" id="searchKeyword" class="form-control" placeholder="Nhập từ khóa tìm kiếm (mã, tên, email, sđt)...">
                <button class="btn btn-primary" onclick="searchStudents()">Tìm kiếm</button>
            </div>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-success" onclick="openAddModal()">+ Thêm sinh viên</button>
        </div>
    </div>

    <!-- Bảng Danh Sách Sinh Viên -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>Mã SV</th>
                <th>Họ và Tên</th>
                <th>Email</th>
                <th>Số Điện Thoại</th>
                <th>Lớp</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            <!-- Dữ liệu render từ API -->
        </tbody>
    </table>

    <!-- Modal Form Thêm/Sửa Sinh Viên -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm Sinh Viên</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="studentId">
                    <div class="mb-2">
                        <label>Mã Sinh Viên:</label>
                        <input type="text" id="studentCode" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Họ và Tên:</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Email:</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Số Điện Thoại:</label>
                        <input type="text" id="phone" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label>Lớp:</label>
                        <input type="text" id="className" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button class="btn btn-primary" onclick="saveStudent()">Lưu thông tin</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api/students';
        let modal;

        document.addEventListener('DOMContentLoaded', () => {
            modal = new bootstrap.Modal(document.getElementById('studentModal'));
            loadStudents();
        });

        // 1. Lấy và hiển thị danh sách sinh viên
        function loadStudents(keyword = '') {
            let url = API_URL;
            if (keyword) url += `?keyword=${encodeURIComponent(keyword)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('studentTableBody');
                    tbody.innerHTML = '';
                    data.forEach(s => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${s.studentCode || ''}</td>
                                <td>${s.fullName || ''}</td>
                                <td>${s.email || ''}</td>
                                <td>${s.phone || ''}</td>
                                <td>${s.className || ''}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick="openEditModal('${s.id}', '${s.studentCode}', '${s.fullName}', '${s.email}', '${s.phone || ''}', '${s.className || ''}')">Sửa</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">Xóa</button>
                                </td>
                            </tr>
                        `;
                    });
                });
        }

        // 2. Tìm kiếm sinh viên
        function searchStudents() {
            const keyword = document.getElementById('searchKeyword').value;
            loadStudents(keyword);
        }

        // 3. Mở Modal Thêm
        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Thêm Sinh Viên';
            document.getElementById('studentId').value = '';
            document.getElementById('studentCode').value = '';
            document.getElementById('fullName').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('className').value = '';
            modal.show();
        }

        // 4. Mở Modal Sửa
        function openEditModal(id, code, name, email, phone, className) {
            document.getElementById('modalTitle').innerText = 'Cập Nhật Sinh Viên';
            document.getElementById('studentId').value = id;
            document.getElementById('studentCode').value = code;
            document.getElementById('fullName').value = name;
            document.getElementById('email').value = email;
            document.getElementById('phone').value = phone;
            document.getElementById('className').value = className;
            modal.show();
        }

        // 5. Lưu (Thêm hoặc Cập nhật)
        function saveStudent() {
            const id = document.getElementById('studentId').value;
            const student = {
                studentCode: document.getElementById('studentCode').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                className: document.getElementById('className').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            }).then(res => {
                if (res.ok) {
                    modal.hide();
                    loadStudents();
                } else {
                    alert('Thao tác thất bại!');
                }
            });
        }

        // 6. Xóa sinh viên
        function deleteStudent(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sinh viên này?')) {
                fetch(`${API_URL}/${id}`, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) loadStudents();
                        else alert('Xóa thất bại!');
                    });
            }
        }
    </script>
</body>
</html>
